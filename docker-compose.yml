# Local infrastructure and services (PLAN 15, M0b).
#   infra profile: Postgres, Kafka, SeaweedFS and their one-off init jobs (daily work).
#   full profile:  infra plus the services (auth-service, policy-service and the gateway).
#   tools profile: optional Kafka UI.
# Copy .env.example to .env and set the passwords before the first start.
name: mini-insurance

services:
  postgres:
    image: postgres:17.12-alpine
    profiles: [infra, full]
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - ./config/postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    # Host port 15432 because a locally installed PostgreSQL often owns 5432.
    # Containers still reach Postgres at postgres:5432.
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  kafka:
    image: apache/kafka:4.2.2
    profiles: [infra, full]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT is for containers on the compose network (kafka:9092); HOST is for tools on the
      # host machine (localhost:9094). Kafka tells each client which address to reconnect to.
      KAFKA_LISTENERS: PLAINTEXT://:9092,HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 768m

  kafka-topics:
    image: apache/kafka:4.2.2
    profiles: [infra, full]
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in user.events policy.events claim.events payment.events; do
          for name in $$topic $$topic.DLT; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$name --partitions 3 --replication-factor 1
          done
        done
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [tools]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8090:8080"
    mem_limit: 256m

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    profiles: [infra, full]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # The S3 identity is written from the environment at start, so no credentials live in Git.
    command:
      - |
        mkdir -p /etc/seaweedfs && cat > /etc/seaweedfs/s3.json <<EOF
        {"identities":[{"name":"app","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip=seaweedfs -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 512m

  seaweedfs-bucket:
    image: amazon/aws-cli:2.41.1
    profiles: [infra, full]
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    # The bucket stays private: no public-read policy is set, and downloads use presigned URLs (PLAN 12).
    command:
      - |
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket insurance-documents 2>/dev/null ||
        aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket insurance-documents
    restart: "no"

  # Shared store for the gateway's rate limits (PLAN 3, ADR-009). Never published to the host. If Redis is
  # down the gateway fails open, so this is not a single point of failure for logins (account lockout is in Postgres).
  redis:
    image: redis:8.6.8-alpine
    profiles: [infra, full]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 64mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: "-Xmx256m"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: insurance
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Without this key the service refuses to start. Generate it as described in docs/runbook.md.
      AUTH_JWT_PRIVATE_KEY_BASE64: ${AUTH_JWT_PRIVATE_KEY_BASE64}
      AUTH_SEED_PLATFORM_ADMIN_EMAIL: ${AUTH_SEED_PLATFORM_ADMIN_EMAIL:-}
      AUTH_SEED_PLATFORM_ADMIN_PASSWORD: ${AUTH_SEED_PLATFORM_ADMIN_PASSWORD:-}
      # policy-service presents this secret to get SERVICE tokens for internal calls (ADR-014).
      AUTH_SERVICE_SECRET_POLICY_SERVICE: ${SERVICE_SECRET_POLICY_SERVICE}
      # claim-service presents its own secret for the policy fallback (ADR-014, M5a).
      AUTH_SERVICE_SECRET_CLAIM_SERVICE: ${SERVICE_SECRET_CLAIM_SERVICE}
    # Not published to the host: clients reach auth-service through the gateway (PLAN 12). Debug with
    # `docker compose exec` or through the gateway's routes.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 384m

  # Catalogue and, from M4, policies (PLAN 3). Not published: clients reach it through the gateway. It seeds the
  # fictional catalogue on start (PLAN 5.4); seeding skips plans that already exist.
  policy-service:
    build:
      context: .
      dockerfile: policy-service/Dockerfile
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
      # Topics are created by kafka-topics; the broker does not create them on demand.
      kafka-topics:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: "-Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/policy_db
      SPRING_DATASOURCE_USERNAME: insurance
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Access tokens are checked against auth-service's published keys, fetched on the first request.
      POLICY_JWT_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      CATALOGUE_SEED_ENABLED: "true"
      # Encrypts personal data such as the national ID (D37, ADR-012). Without it the service refuses to start.
      POLICY_FIELD_KEY_BASE64: ${POLICY_FIELD_KEY_BASE64}
      POLICY_FIELD_KEY_ID: ${POLICY_FIELD_KEY_ID}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Purchase creates the premium in payment-service with a SERVICE token (M4b, ADR-014). Internal addresses only.
      POLICY_PAYMENT_BASE_URL: http://payment-service:8080
      POLICY_SERVICE_TOKEN_URL: http://auth-service:8080/internal/service-token
      POLICY_SERVICE_AUTH_SECRET: ${SERVICE_SECRET_POLICY_SERVICE}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    # Catalogue, policies, Kafka clients and the payment client: it reached about 380 MiB idle at M4b, so it gets
    # more headroom than the other services. The heap stays at 256m.
    mem_limit: 512m

  # Mock checkout, payments and the payment ledger (PLAN 3, M4b). Not published: customers pay through the gateway,
  # and policy-service calls /internal/payments directly on the compose network.
  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: "-Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: insurance
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PAYMENT_JWT_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Mock payouts to these holder ids are declined. Empty in normal use; the smoke script sets it
      # to prove the failure and retry path.
      PAYMENTS_MOCK_PAYOUT_DECLINE_PAYEES: ${PAYMENTS_MOCK_PAYOUT_DECLINE_PAYEES:-}
      PAYMENTS_MOCK_REFUND_DECLINE_HOLDERS: ${PAYMENTS_MOCK_REFUND_DECLINE_HOLDERS:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 384m

  # Reads every service's events and writes the notification log (PLAN 3, M8a). No public API and nothing routed through
  # the gateway; the log is read from its database.
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: "-Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: insurance
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 384m

  # The policy read model for claims (PLAN 3, M5a). Not published: customers reach it through the gateway,
  # and it calls policy-service's /internal/policies on the compose network with its own SERVICE token.
  claim-service:
    build:
      context: .
      dockerfile: claim-service/Dockerfile
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-topics:
        condition: service_completed_successfully
      seaweedfs-bucket:
        condition: service_completed_successfully
    environment:
      JAVA_OPTS: "-Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/claim_db
      SPRING_DATASOURCE_USERNAME: insurance
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CLAIM_JWT_JWK_SET_URI: http://auth-service:8080/.well-known/jwks.json
      CLAIM_SERVICE_AUTH_TOKEN_URL: http://auth-service:8080/internal/service-token
      CLAIM_SERVICE_AUTH_SECRET: ${SERVICE_SECRET_CLAIM_SERVICE}
      CLAIM_POLICY_SERVICE_BASE_URL: http://policy-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Documents (M5b): uploads go to SeaweedFS on the compose network; presigned links use the host-published port.
      CLAIM_STORAGE_ENDPOINT: http://seaweedfs:8333
      CLAIM_STORAGE_PUBLIC_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 384m

  # The only published service: every client request enters here (PLAN 3, 12). Port is GATEWAY_HOST_PORT in .env.
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    profiles: [full]
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      policy-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      claim-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xmx256m"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 384m

volumes:
  postgres-data:
  seaweedfs-data:
