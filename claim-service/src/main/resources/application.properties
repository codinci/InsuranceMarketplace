spring.application.name=claim-service
server.port=8080
# Behind the gateway, the client address comes from X-Forwarded-For set by the gateway (ADR-009).
server.forward-headers-strategy=native
management.endpoints.web.exposure.include=health,info
logging.structured.format.console=logstash

# Database: one database per service (PLAN 3). Local defaults point at the compose Postgres on the host machine.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/claim_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:insurance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Schema only through Flyway (CLAUDE.md Domain rules).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Access tokens and SERVICE tokens are signed by auth-service and checked against its published keys (ADR-006, ADR-014).
claim.jwt.issuer=${CLAIM_JWT_ISSUER:mini-insurance-auth}
claim.jwt.jwk-set-uri=${CLAIM_JWT_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}

# This service's SERVICE token for the policy-service fallback (ADR-014). The secret comes from the environment.
claim.service-auth.token-url=${CLAIM_SERVICE_AUTH_TOKEN_URL:http://localhost:8080/internal/service-token}
claim.service-auth.service-name=claim-service
claim.service-auth.secret=${CLAIM_SERVICE_AUTH_SECRET:}

# Fallback lookup in policy-service (PLAN 11): timeouts, retries, and the Retry-After sent with a 503.
claim.policy-service.base-url=${CLAIM_POLICY_SERVICE_BASE_URL:http://localhost:8081}
claim.policy-service.retry-after=30s

# Claim documents (PLAN 12, M5b): SeaweedFS through the S3 API. The bucket is private; downloads are presigned.
# endpoint is for uploads on the compose network; public-endpoint is what the customer's browser reaches.
claim.storage.endpoint=${CLAIM_STORAGE_ENDPOINT:http://localhost:8333}
claim.storage.public-endpoint=${CLAIM_STORAGE_PUBLIC_ENDPOINT:http://localhost:8333}
claim.storage.region=us-east-1
claim.storage.bucket=insurance-documents
claim.storage.access-key=${S3_ACCESS_KEY:}
claim.storage.secret-key=${S3_SECRET_KEY:}
claim.storage.presign-ttl=5m

# One document may be 10 MB at most; the request allows a little more for the form fields (CLAUDE.md).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Business calendar for filing deadlines (D38): the zone the business runs in.
claim.business-zone=Africa/Nairobi

# Kafka (ADR-013). Values are JSON strings; the envelope is parsed in the listener.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=claim-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# How often the outbox relay looks for unsent events (ADR-013). Claim-service sends none yet (M5b).
messaging.outbox.relay-delay-ms=${CLAIM_OUTBOX_RELAY_DELAY_MS:1000}
