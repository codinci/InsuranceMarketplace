spring.application.name=api-gateway
server.port=8080
management.endpoints.web.exposure.include=health,info
logging.structured.format.console=logstash

# Routes are data (PLAN 3, 21.5): a new service gets a route here, not gateway code. A service that is not running
# answers 503 UPSTREAM_UNAVAILABLE. Each Path list maps one service's public API (PLAN 13).
spring.cloud.gateway.server.webflux.x-forwarded.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=auth-docs
spring.cloud.gateway.server.webflux.routes[0].uri=${GATEWAY_AUTH_URI:http://auth-service:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RewritePath=/v3/api-docs/auth,/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].id=auth
spring.cloud.gateway.server.webflux.routes[1].uri=${GATEWAY_AUTH_URI:http://auth-service:8080}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/auth/**,/api/v1/admin/users/**,/.well-known/jwks.json
spring.cloud.gateway.server.webflux.routes[2].id=policy
spring.cloud.gateway.server.webflux.routes[2].uri=${GATEWAY_POLICY_URI:http://policy-service:8080}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/insurers/**,/api/v1/products/**,/api/v1/plans/**,/api/v1/quotes/**,/api/v1/policies/**,/api/v1/me/**,/api/v1/admin/insurers/**,/api/v1/admin/plans/**
spring.cloud.gateway.server.webflux.routes[3].id=claim
spring.cloud.gateway.server.webflux.routes[3].uri=${GATEWAY_CLAIM_URI:http://claim-service:8080}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/claims/**
spring.cloud.gateway.server.webflux.routes[4].id=payment
spring.cloud.gateway.server.webflux.routes[4].uri=${GATEWAY_PAYMENT_URI:http://payment-service:8080}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/payments/**

# Coarse JWT check at the edge: the issuer and the published keys of auth-service (PLAN 12).
gateway.jwt.issuer=${GATEWAY_JWT_ISSUER:mini-insurance-auth}
gateway.jwt.jwk-set-uri=${GATEWAY_JWT_JWK_SET_URI:http://auth-service:8080/.well-known/jwks.json}

# CORS: empty until the frontend exists (PLAN 17). Comma-separated origins, for example http://localhost:5173.
gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:}

# Rate limit per client IP: 2 requests a second sustained, bursts of 100 (ADR-009).
gateway.rate-limit.replenish-rate-per-second=2
gateway.rate-limit.burst-capacity=100

# Redis for the rate limits. Never published to the host (PLAN 12, ADR-009).
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Aggregated Swagger: the UI lists each service's spec through the gateway (PLAN 14).
springdoc.swagger-ui.urls[0].name=auth
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth
