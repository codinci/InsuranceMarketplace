spring.application.name=notification-service
server.port=8080
management.endpoints.web.exposure.include=health,info
logging.structured.format.console=logstash

# Database: one database per service (PLAN 3). Local defaults point at the compose Postgres on the host machine.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/notification_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:insurance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Schema only through Flyway (CLAUDE.md Domain rules).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Kafka (ADR-013). Values are JSON strings; the envelope is parsed in the listener. A new consumer group reads
# each topic from the beginning, so events from before M8a (without holderUserId) are skipped, not failed.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# How often the outbox relay looks for unsent events (ADR-013). Nothing is written yet.
messaging.outbox.relay-delay-ms=${NOTIFICATION_OUTBOX_RELAY_DELAY_MS:1000}
