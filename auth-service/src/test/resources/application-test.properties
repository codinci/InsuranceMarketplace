# Test profile: ephemeral signing key, a seeded platform admin, and high rate limits so that tests in one
# context do not throttle each other. RateLimitIT overrides the limits itself.
auth.jwt.generate-ephemeral-key=true
auth.login.attempts-per-minute-per-ip=1000
auth.login.attempts-per-minute-per-email=1000
auth.seed.platform-admin-email=platform.admin@example.com
auth.seed.platform-admin-password=platform-admin-password-1
