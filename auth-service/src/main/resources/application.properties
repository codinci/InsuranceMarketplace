spring.application.name=auth-service
server.port=8080
management.endpoints.web.exposure.include=health,info
logging.structured.format.console=logstash

# Database: one database per service (PLAN 3). Local defaults point at the compose Postgres on the host machine.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/auth_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:insurance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Schema only through Flyway (CLAUDE.md Domain rules).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Tokens (PLAN 12): access 15 minutes, refresh 7 days with rotation.
auth.token.access-ttl=PT15M
auth.token.refresh-ttl=P7D

# Signing (PLAN 12, ADR-006 and ADR-007). The private key is required unless generate-ephemeral-key is true.
auth.jwt.issuer=${AUTH_JWT_ISSUER:mini-insurance-auth}
auth.jwt.key-id=${AUTH_JWT_KEY_ID:auth-key-1}
auth.jwt.private-key-base64=${AUTH_JWT_PRIVATE_KEY_BASE64:}
auth.jwt.generate-ephemeral-key=${AUTH_JWT_GENERATE_EPHEMERAL_KEY:false}

# Login protection (PLAN 12): lockout after repeated failures, and rate limits per client IP and per email.
auth.login.max-failed-attempts=5
auth.login.lock-duration=PT15M
auth.login.attempts-per-minute-per-ip=20
auth.login.attempts-per-minute-per-email=10

# First platform admin, created at startup if no user has this email (PLAN 4). Leave empty to skip.
auth.seed.platform-admin-email=${AUTH_SEED_PLATFORM_ADMIN_EMAIL:}
auth.seed.platform-admin-password=${AUTH_SEED_PLATFORM_ADMIN_PASSWORD:}
