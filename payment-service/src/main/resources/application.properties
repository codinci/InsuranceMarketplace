spring.application.name=payment-service
server.port=8080
# Behind the gateway, the client address comes from X-Forwarded-For set by the gateway (ADR-009).
server.forward-headers-strategy=native
management.endpoints.web.exposure.include=health,info
logging.structured.format.console=logstash

# Database: one database per service (PLAN 3). Local defaults point at the compose Postgres on the host machine.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/payment_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:insurance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Schema only through Flyway (CLAUDE.md Domain rules).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Access tokens and SERVICE tokens are signed by auth-service and checked against its published keys (ADR-006, ADR-014).
payment.jwt.issuer=${PAYMENT_JWT_ISSUER:mini-insurance-auth}
payment.jwt.jwk-set-uri=${PAYMENT_JWT_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}

# Kafka (ADR-013). Values are JSON strings; the envelope is parsed in the listener.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=payment-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# How often the outbox relay looks for unsent events (ADR-013).
messaging.outbox.relay-delay-ms=${PAYMENT_OUTBOX_RELAY_DELAY_MS:1000}

# Mock payouts (M7): holder ids, comma separated, whose payouts the mock provider declines. Empty in
# normal use; tests and the smoke run set it to exercise the failure and retry path.
payments.mock.payout-decline-payees=${PAYMENTS_MOCK_PAYOUT_DECLINE_PAYEES:}
# Holder user ids whose premium refunds the mock provider declines (M8b; smoke script and demos).
payments.mock.refund-decline-holders=${PAYMENTS_MOCK_REFUND_DECLINE_HOLDERS:}
