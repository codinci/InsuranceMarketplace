# Test profile. Tokens are checked by TestJwtConfig's decoder, so the JWKS address is never called.
policy.jwt.jwk-set-uri=http://jwks.invalid/.well-known/jwks.json
catalogue.seed.enabled=false
# A fixed key for tests only. It protects nothing real: "test-only-key-not-a-secret-32byt" in base64.
policy.field-encryption.key-base64=dGVzdC1vbmx5LWtleS1ub3QtYS1zZWNyZXQtMzJieXQ=
policy.field-encryption.key-id=test-key
