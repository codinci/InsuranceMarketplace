spring.application.name=policy-service
server.port=8080
# Behind the gateway, the client address comes from X-Forwarded-For set by the gateway (ADR-009).
server.forward-headers-strategy=native
management.endpoints.web.exposure.include=health,info
logging.structured.format.console=logstash

# Database: one database per service (PLAN 3). Local defaults point at the compose Postgres on the host machine.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/policy_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:insurance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Schema only through Flyway (CLAUDE.md Domain rules).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Access tokens are signed by auth-service and checked against its published keys (PLAN 12, ADR-006).
policy.jwt.issuer=${POLICY_JWT_ISSUER:mini-insurance-auth}
policy.jwt.jwk-set-uri=${POLICY_JWT_JWK_SET_URI:http://localhost:8080/.well-known/jwks.json}

# Personal data encrypted at rest (PLAN 12, D37, ADR-012). A 32-byte key, base64, and its id. Startup fails without them.
policy.field-encryption.key-base64=${POLICY_FIELD_KEY_BASE64:}
policy.field-encryption.key-id=${POLICY_FIELD_KEY_ID:}

# Business dates (cover start, sale periods) follow this calendar, not UTC (D38).
policy.business-zone=${POLICY_BUSINESS_ZONE:Africa/Nairobi}

# Seed plans from classpath:catalogue-seed at startup (PLAN 5.4). Compose turns this on; it is off elsewhere.
catalogue.seed.enabled=${CATALOGUE_SEED_ENABLED:false}

# Kafka (ADR-013). Values are JSON strings; the envelope is parsed in the listener.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=policy-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# How often the outbox relay looks for unsent events (ADR-013).
messaging.outbox.relay-delay-ms=${POLICY_OUTBOX_RELAY_DELAY_MS:1000}

# payment-service creates the premium at purchase (M4b). Internal address; never through the gateway.
policy.payment.base-url=${POLICY_PAYMENT_BASE_URL:http://localhost:8083}
# SERVICE token for that call (ADR-014). The secret comes from the environment; empty means no token.
policy.service-auth.token-url=${POLICY_SERVICE_TOKEN_URL:http://localhost:8081/internal/service-token}
policy.service-auth.secret=${POLICY_SERVICE_AUTH_SECRET:}

# Unpaid policies are cancelled after this long (PLAN 8.2). The job checks every minute.
policy.unpaid.deadline=${POLICY_UNPAID_DEADLINE:PT24H}
policy.unpaid.check-delay-ms=${POLICY_UNPAID_CHECK_DELAY_MS:60000}
